<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Web ATM - Giriş Yap</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background-color: #0f172a; color: #f8fafc; display: flex; justify-content: center; align-items: center; height: 100vh; }
        .login-card { background-color: #1e293b; padding: 2.5rem; border-radius: 16px; box-shadow: 0 10px 25px rgba(0, 0, 0, 0.4); width: 350px; }
        h2 { text-align: center; color: #38bdf8; margin-bottom: 1.5rem; }
        .input-group { margin-bottom: 1.2rem; }
        .input-group label { display: block; margin-bottom: 0.5rem; color: #94a3b8; font-size: 0.9rem; }
        .input-group input { width: 100%; padding: 0.75rem; border-radius: 8px; border: 1px solid #334155; background-color: #0f172a; color: white; outline: none; }
        .input-group input:focus { border-color: #38bdf8; }
        .btn-submit { width: 100%; padding: 0.8rem; background-color: #22c55e; color: white; border: none; border-radius: 8px; font-weight: bold; cursor: pointer; transition: background 0.2s; }
        .btn-submit:hover { background-color: #16a34a; }
        .back-link { display: block; text-align: center; margin-top: 1rem; color: #94a3b8; text-decoration: none; font-size: 0.9rem; }
        .back-link:hover { color: #38bdf8; }
    </style>
</head>
<body>

    <div class="login-card">
        <h2>🔐 Kullanıcı Girişi</h2>
        
        <form onsubmit="handleLogin(event)">
            <div class="input-group">
                <label for="username">Müşteri No / T.C.</label>
                <input type="text" id="username" required placeholder="Müşteri numaranızı girin">
            </div>

            <div class="input-group">
                <label for="password">Şifre</label>
                <input type="password" id="password" required placeholder="••••••••">
            </div>

            <button type="submit" class="btn-submit">Giriş Yap</button>
        </form>

        <a href="/" class="back-link">← Ana Sayfaya Dön</a>
    </div>

    <script src="/app.js"></script>
</body>
</html>
