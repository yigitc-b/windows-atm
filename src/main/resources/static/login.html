<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ATM Web - Giriş Yap</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #0f172a;
            color: #f8fafc;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        header {
            background-color: #1e293b;
            border-bottom: 1px solid #334155;
            padding: 1rem 2rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .logo {
            font-size: 1.4rem;
            font-weight: bold;
            color: #38bdf8;
            text-decoration: none;
        }

        .nav-links a {
            color: #94a3b8;
            text-decoration: none;
            font-size: 1rem;
        }

        .container {
            flex: 1;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 2rem;
        }

        .login-card {
            background-color: #1e293b;
            padding: 2rem;
            border-radius: 12px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.5);
            width: 100%;
            max-width: 450px;
            border: 1px solid #334155;
        }

        h2 {
            text-align: center;
            margin-bottom: 1.5rem;
            color: #38bdf8;
        }

        .form-group {
            margin-bottom: 1.2rem;
        }

        label {
            display: block;
            margin-bottom: 0.5rem;
            font-size: 0.9rem;
            color: #94a3b8;
        }

        input {
            width: 100%;
            padding: 0.75rem;
            border-radius: 6px;
            border: 1px solid #475569;
            background-color: #0f172a;
            color: #fff;
            font-size: 1rem;
            outline: none;
        }

        input:focus {
            border-color: #38bdf8;
        }

        button {
            width: 100%;
            padding: 0.75rem;
            background-color: #0284c7;
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 1rem;
            font-weight: bold;
            cursor: pointer;
            margin-top: 0.5rem;
        }

        button:hover {
            background-color: #0369a1;
        }

        .response-container {
            margin-top: 1.5rem;
        }

        pre {
            background-color: #090d16;
            color: #4ade80;
            padding: 1rem;
            border-radius: 6px;
            font-family: monospace;
            font-size: 0.85rem;
            white-space: pre-wrap;
            word-wrap: break-word;
            border: 1px solid #334155;
            max-height: 200px;
            overflow-y: auto;
        }
    </style>
</head>
<body>

    <header>
        <a href="/" class="logo">ATM Bank</a>
        <nav class="nav-links">
            <a href="/about">Hakkımızda</a>
        </nav>
    </header>

    <div class="container">
        <div class="login-card">
            <h2>Giriş Yap</h2>
            
            <form id="loginForm">
                <div class="form-group">
                    <label for="username">Kullanıcı Adı</label>
                    <input type="text" id="username" required>
                </div>

                <div class="form-group">
                    <label for="password">Şifre</label>
                    <input type="password" id="password" required>
                </div>

                <button type="submit">Giriş</button>
            </form>

            <div class="response-container">
                <pre id="responseOutput">// Sunucu yanıtı burada görünecek...</pre>
            </div>
        </div>
    </div>

    <script>
        document.getElementById('loginForm').addEventListener('submit', async function(event) {
            event.preventDefault();

            const usernameInput = document.getElementById('username').value;
            const passwordInput = document.getElementById('password').value;
            const outputElement = document.getElementById('responseOutput');

            outputElement.style.color = "#facc15";
            outputElement.textContent = "İstek gönderiliyor...";

            try {
                const response = await fetch('api/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username: usernameInput, password: passwordInput })
                });

                const data = await response.json();

                if (response.ok) {
                    outputElement.style.color = "#4ade80";
                } else {
                    outputElement.style.color = "#f87171";
                }

                outputElement.textContent = JSON.stringify(data, null, 2);

            } catch (error) {
                outputElement.style.color = "#f87171";
                outputElement.textContent = "Hata oluştu: " + error;
            }
        });
    </script>

</body>
</html>
