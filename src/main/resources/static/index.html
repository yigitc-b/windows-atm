<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Web ATM - Bankacılık İşlemleri</title>
    <!-- Google Fonts & FontAwesome İkonları -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="atm-container">
        <!-- ATM Header -->
        <header class="atm-header">
            <div class="brand">
                <i class="fa-solid fa-building-columns"></i>
                <span>WEB BANK</span>
            </div>
            <div id="user-info" class="user-info hidden">
                <span id="user-name-display">Hoş geldiniz</span>
                <button id="logout-btn" class="btn-logout" title="Çıkış Yap">
                    <i class="fa-solid fa-power-off"></i>
                </button>
            </div>
        </header>

        <!-- Dynamic Content Area (SPA Screens) -->
        <main class="atm-body">

            <!-- 1. VIEW: LOGIN PAGE -->
            <section id="view-login" class="view">
                <h2>Oturum Açın</h2>
                <p class="subtitle">ATM işlemlerine devam etmek için giriş yapın</p>
                
                <form id="login-form">
                    <div class="input-group">
                        <i class="fa-solid fa-user"></i>
                        <input type="text" id="username" placeholder="Kullanıcı Adı" required autocomplete="off">
                    </div>
                    <div class="input-group">
                        <i class="fa-solid fa-lock"></i>
                        <input type="password" id="password" placeholder="Şifre" required>
                    </div>
                    <button type="submit" class="btn btn-primary btn-block">Giriş Yap</button>
                </form>
            </section>

            <!-- 2. VIEW: DASHBOARD (ANA MENÜ) -->
            <section id="view-dashboard" class="view hidden">
                <div class="balance-card">
                    <span class="label">Mevcut Bakiye</span>
                    <div class="amount" id="account-balance">₺0.00</div>
                </div>

                <div class="action-grid">
                    <button class="action-card" onclick="app.navigateTo('view-deposit')">
                        <i class="fa-solid fa-circle-arrow-down"></i>
                        <span>Para Yatır</span>
                    </button>
                    <button class="action-card" onclick="app.navigateTo('view-withdraw')">
                        <i class="fa-solid fa-circle-arrow-up"></i>
                        <span>Para Çek</span>
                    </button>
                    <button class="action-card" onclick="app.navigateTo('view-transfer')">
                        <i class="fa-solid fa-money-bill-transfer"></i>
                        <span>Havale / EFT</span>
                    </button>
                    <button class="action-card" onclick="app.navigateTo('view-transactions')">
                        <i class="fa-solid fa-receipt"></i>
                        <span>Son İşlemler</span>
                    </button>
                </div>
            </section>

            <!-- 3. VIEW: PARA ÇEKME -->
            <section id="view-withdraw" class="view hidden">
                <button class="btn-back" onclick="app.navigateTo('view-dashboard')">
                    <i class="fa-solid fa-arrow-left"></i> Geri
                </button>
                <h2>Para Çekme</h2>
                <form id="withdraw-form">
                    <div class="input-group">
                        <i class="fa-solid fa-turkish-lira-sign"></i>
                        <input type="number" id="withdraw-amount" min="10" step="10" placeholder="Çekilecek Tutar" required>
                    </div>
                    <button type="submit" class="btn btn-primary btn-block">Onayla ve Çek</button>
                </form>
            </section>

            <!-- 4. VIEW: PARA YATIRMA -->
            <section id="view-deposit" class="view hidden">
                <button class="btn-back" onclick="app.navigateTo('view-dashboard')">
                    <i class="fa-solid fa-arrow-left"></i> Geri
                </button>
                <h2>Para Yatırma</h2>
                <form id="deposit-form">
                    <div class="input-group">
                        <i class="fa-solid fa-turkish-lira-sign"></i>
                        <input type="number" id="deposit-amount" min="10" step="10" placeholder="Yatırılacak Tutar" required>
                    </div>
                    <button type="submit" class="btn btn-primary btn-block">Onayla ve Yatır</button>
                </form>
            </section>

        </main>

        <!-- Message/Notification Toast -->
        <div id="toast-message" class="toast hidden"></div>
    </div>

    <script src="app.js"></script>
</body>
</html>
