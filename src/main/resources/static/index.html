<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Web ATM - Ana Sayfa</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background-color: #0f172a; color: #f8fafc; display: flex; justify-content: center; align-items: center; height: 100vh; }
        .container { background-color: #1e293b; padding: 2.5rem; border-radius: 16px; box-shadow: 0 10px 25px rgba(0, 0, 0, 0.4); text-align: center; width: 350px; }
        h1 { color: #38bdf8; margin-bottom: 0.5rem; font-size: 1.8rem; }
        p { color: #94a3b8; margin-bottom: 2rem; font-size: 0.95rem; }
        .btn-group { display: flex; flex-direction: column; gap: 1rem; }
        .btn { padding: 0.8rem; border: none; border-radius: 8px; font-weight: bold; font-size: 1rem; cursor: pointer; transition: all 0.2s; }
        .btn-about { background-color: #334155; color: #f8fafc; }
        .btn-about:hover { background-color: #475569; }
        .btn-login { background-color: #0284c7; color: white; }
        .btn-login:hover { background-color: #0369a1; }
        #about-modal { display: none; margin-top: 1.5rem; padding: 1rem; background-color: #0f172a; border-radius: 8px; border: 1px solid #38bdf8; color: #cbd5e1; font-size: 0.9rem; }
    </style>
</head>
<body>

    <div class="container">
        <h1>🏧 Web ATM</h1>
        <p>Lütfen yapmak istediğiniz işlemi seçin</p>

        <div class="btn-group">
            <button class="btn btn-about" onclick="toggleAbout()">Hakkımızda</button>
            <button class="btn btn-login" onclick="goToLogin()">Giriş Yap</button>
        </div>

        <div id="about-modal">
            Bu uygulama Spring Boot & JavaScript mimarisi ile geliştirilmiş güvenli bir Web ATM simülasyonudur.
        </div>
    </div>

    <script src="/app.js"></script>
</body>
</html>
