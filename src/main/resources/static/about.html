<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ATM Web - Hakkımızda</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #0f172a;
            color: #f8fafc;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        header {
            background-color: #1e293b;
            border-bottom: 1px solid #334155;
            padding: 1rem 2rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .nav-left {
            display: flex;
            align-items: center;
            gap: 2rem;
        }

        .logo {
            font-size: 1.4rem;
            font-weight: bold;
            color: #38bdf8;
            text-decoration: none;
        }

        .btn-login {
            background-color: #0284c7;
            color: white;
            padding: 0.5rem 1.2rem;
            border-radius: 6px;
            text-decoration: none;
            font-weight: 500;
        }

        main {
            flex: 1;
            padding: 3rem 2rem;
            max-width: 900px;
            margin: 0 auto;
            width: 100%;
        }

        .card {
            background-color: #1e293b;
            border: 1px solid #334155;
            border-radius: 12px;
            padding: 2rem;
        }

        .card h1 {
            color: #38bdf8;
            margin-bottom: 1rem;
        }

        .card p {
            color: #94a3b8;
            line-height: 1.6;
        }
    </style>
</head>
<body>

    <header>
        <div class="nav-left">
            <a href="/" class="logo">ATM Bank</a>
        </div>

        <div class="nav-right">
            <a href="/login" class="btn-login">Giriş Yap</a>
        </div>
    </header>

    <main>
        <section class="card">
            <h1>Hakkımızda</h1>
            <p>
                Bu proje, modern web teknolojileri ve Spring Boot altyapısı kullanılarak geliştirilmiş güvenli bir ATM bankacılık simülasyon sistemidir. 
                RESTful API standartları ve JWT tabanlı kimlik doğrulama mekanizmaları temel alınarak mimarisi tasarlanmıştır.
            </p>
        </section>
    </main>

</body>
</html>
